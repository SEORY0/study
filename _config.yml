# study: SEORY0's study notes, served at https://seory0.github.io/study/
# by GitHub Pages (Deploy from a branch: main, / root). How a note is
# written and how the map is drawn: site/README.md.
#
#   studies/<subject>/<slug>.md  the notes, one folder per subject
#   site/                        layouts, includes, styles, scripts, fonts,
#                                the map's vocabulary (site/_data/study.yml)
#   tools/                       lint, the README index, font and card builders
#
# This file stays at the root: GitHub Pages builds from here.

title: "study"
description: "전자공학과 IT를 공부하며 쓰는 노트. 한 과목에서 배운 개념이 다른 과목에서 다시 나타나는 자리를 이어 그린 지도."
url: "https://seory0.github.io"
baseurl: "/study"
repository: "SEORY0/study"
lang: ko
locale: ko_KR
author:
  name: "SEORY0"
  email: seory0@outlook.kr
  url: "https://seory0.github.io"

# The share card, 1200 x 630, drawn by tools/og-image.py.
og_image: "/site/assets/og.png"
og_image_alt: "study: an ASCII map of study notes, subjects as lanes and notes as dots"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    span:
      line_numbers: false

permalink: pretty

layouts_dir: site/_layouts
includes_dir: site/_includes
data_dir: site/_data

# Notes: studies/<subject>/<slug>.md -> /study/<slug>/. Subjects, areas and
# threads live in site/_data/study.yml.
defaults:
  -
    scope:
      path: "studies"
    values:
      layout: "note"
      permalink: /:basename/

compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]

sass:
  sass_dir: site/_sass
  style: :compressed

plugins:
  - jekyll-sitemap

exclude:
  - .claude
  - .jekyll-cache
  - tools
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - site/README.md
  - CLAUDE.md
